# 数据源
spring:
  datasource:
    url: jdbc:mysql:///big_event
    username: lordbao
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
# Mybatis的配置
mybatis:
  mapper-locations: classpath:/mappers/*Mapper.xml # 指定mapper.xml的位置
  configuration:
    map-underscore-to-camel-case: true  #Java实体到数据库的驼峰转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # Mybatis相关日志输出到控制台
    auto-mapping-behavior: full #自动映射级别设置为full.
logging:
  level:
    root: warn #设置全局日志级别

