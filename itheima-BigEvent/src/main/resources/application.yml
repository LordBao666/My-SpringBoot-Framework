# 数据源
spring:
  datasource:
    url: jdbc:mysql:///big_event
    username: lordbao
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  profiles:
    include: qiniu_oss #添加application-qinniu_oss.yaml,注意application-不用写


# Mybatis的配置
mybatis:
  mapper-locations: classpath:/mappers/*Mapper.xml # 指定mapper.xml的位置
  configuration:
    map-underscore-to-camel-case: true  #Java实体到数据库的驼峰转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # Mybatis相关日志输出到控制台
    auto-mapping-behavior: full #自动映射级别设置为full.
logging:
  level:
    root: info #设置全局日志级别


#避免用户传入错误的pageNum的话,实际上reasonable配置就够了
pagehelper:
#  helper-dialect: mysql #指定分页插件使用的数据库方言
  #对分页参数进行合理化处理,比如pageNum小于1的话,会自动设置为1,超过最大页码，会自动设置为最大页码。
  reasonable: true
  #support-methods-arguments: true #支持通过方法参数传递分页参数。
#  params: count=countSql #指定分页插件的参数映射。
