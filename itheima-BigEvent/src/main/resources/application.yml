  datasource: #mysql数据源
    url: jdbc:mysql:///big_event
    username: lordbao
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:   #redis
      host: 192.168.214.49
      port: 6379 #默认就是6379
      password: laozishudao4
  #引入其他配置文件
  profiles:
    include: qiniu_oss #添加application-qinniu_oss.yaml,注意application-不用写


# Mybatis的配置
mybatis:
  mapper-locations: classpath:/mappers/*Mapper.xml # 指定mapper.xml的位置
  configuration:
    map-underscore-to-camel-case: true  #Java实体到数据库的驼峰转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # Mybatis相关日志输出到控制台
    auto-mapping-behavior: full #自动映射级别设置为full.
logging:
  level:
    root: info #设置全局日志级别

# 分页配置
#避免用户传入错误的pageNum的话,实际上reasonable配置就够了
pagehelper:
#  helper-dialect: mysql #指定分页插件使用的数据库方言
  #对分页参数进行合理化处理,比如pageNum小于1的话,会自动设置为1,超过最大页码，会自动设置为最大页码。
  reasonable: true
  #support-methods-arguments: true #支持通过方法参数传递分页参数。
#  params: count=countSql #指定分页插件的参数映射。

# 服务器配置
server:
  #让 Spring Boot 监听所有网络接口,包括本机，局域网,公网IP.
  # 举个例子,假设部署应用的服务器是A,它的局域网IP是192.168.1.1,公网IP是200.1.3.1
  # 那么A自己访问自己时,localhost,局域网IP,公网IP都可以。如果是局域网其他主机,则可以通过局域网IP或公网IP访问A
  # 对于公网的主机而言，只能通过A提供的公网IP对A进行访问
  # address的默认值是localhost,即只能本机测试。你的address可以配置与部署应用相同服务器的IP.
  address: 0.0.0.0
  port: 8080 #默认就是8080

